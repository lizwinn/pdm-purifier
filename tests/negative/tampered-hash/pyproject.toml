[project]
name = "simple"
version = "0.1.0"
description = "A pdm-purifier fixture: a registry wheel, an sdist-only dependency and a script"
requires-python = ">=3.11"
dependencies = [
    "attrs==26.1.0",
    # docopt ships only an sdist, so installing it needs a build, and the
    # build needs setuptools.
    "docopt==0.6.2",
]

[project.scripts]
simple = "simple:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
