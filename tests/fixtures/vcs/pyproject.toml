[project]
name = "vcs"
version = "0.1.0"
description = "A pdm-purifier fixture: dependencies from Mercurial and Subversion"
requires-python = ">=3.11"
dependencies = [
    # A Mercurial repository at a revision.
    "yoyo-migrations @ hg+https://hg.sr.ht/~olly/yoyo@6d255163e92b",
    # A Subversion repository at a revision.
    "docutils @ svn+https://svn.code.sf.net/p/docutils/code/trunk/docutils@10409",
    # A Bazaar branch at a revision.
    "python-dateutil @ bzr+http://bazaar.launchpad.net/~dateutil/dateutil/trunk@135",
]

[project.scripts]
vcs = "vcs:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
