# SPDX-License-Identifier: MIT
#
# Runs every check: the flake's checks (the fixture builds in the Nix
# sandbox and the formatting), their evaluation for every system, the lock
# run against the network, and the `pdm-purifier` command's offline and
# publish verbs.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Flake checks
        run: nix flake check -L
      - name: Evaluation for every system
        run: nix flake check --all-systems --no-build
      - name: Lock run
        run: nix shell '.#cli' 'nixpkgs#python3' 'nixpkgs#gcc' 'nixpkgs#git' -c tests/lock-run.sh
      - name: The pdm-purifier command
        run: nix shell '.#cli' 'nixpkgs#python3' 'nixpkgs#gcc' 'nixpkgs#git' -c tests/interactive.sh
