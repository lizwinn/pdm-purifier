# SPDX-License-Identifier: MIT
#
# Runs every check, on x86_64-linux and aarch64-linux: the flake's checks
# (the fixture builds in the Nix sandbox, the seven conformance-* checks of
# the purifier contract that the sandbox can run, and the formatting), their
# evaluation for every system, and a job named for each conformance check
# that needs the network: conformance-relock, conformance-update and
# conformance-offline.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flake-check:
    strategy:
      fail-fast: false
      matrix:
        # x86_64-linux and aarch64-linux.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Flake checks
        run: nix flake check -L
      - name: Evaluation for every system
        run: nix flake check --all-systems --no-build

  conformance-relock:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Relock every fixture and compare
        run: nix shell '.#cli' 'nixpkgs#python3' 'nixpkgs#gcc' 'nixpkgs#git' 'nixpkgs#mercurial' 'nixpkgs#subversion' 'nixpkgs#breezy' -c tests/lock-run.sh

  conformance-update:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Update the fixture that pins an old version
        run: nix shell '.#cli' 'nixpkgs#python3' 'nixpkgs#git' -c tests/update.sh

  real-world:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Lock and build PDM 2.27.0 at a pinned commit
        run: nix shell '.#cli' 'nixpkgs#python3' 'nixpkgs#git' 'nixpkgs#gcc' 'nixpkgs#pkg-config' 'nixpkgs#libffi.dev' -c tests/real-world.sh

  conformance-offline:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Prefetch, then work with no network, and publish to a local endpoint
        run: nix shell '.#cli' 'nixpkgs#python3' 'nixpkgs#gcc' 'nixpkgs#git' 'nixpkgs#util-linux' -c tests/interactive.sh
